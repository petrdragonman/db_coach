services:
  mysql:
    image: mysql:8.4
    container_name: db_coach_mysql
    environment:
      MYSQL_DATABASE: db_coach
      MYSQL_USER: dbcoach
      MYSQL_PASSWORD: dbcoach
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_coach_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_coach_mysql_data: